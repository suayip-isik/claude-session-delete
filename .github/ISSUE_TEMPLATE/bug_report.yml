name: Bug report
description: /delete did not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If the plugin deleted or stopped something it should not have, please **do not** file it here: report it privately instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary or error text
      description: The summary or message `/delete` printed. Anonymise paths and session ids.
      render: text
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start `claude` in …
        2. …
        3. Run /delete and confirm
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Shown by `claude plugin list`
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Output of `sw_vers -productVersion`
    validations:
      required: true
  - type: dropdown
    id: ripgrep
    attributes:
      label: Is ripgrep installed?
      options:
        - "Yes"
        - "No"
        - "I don't know"
